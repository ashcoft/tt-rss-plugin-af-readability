name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate composer
        run: composer validate --strict

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install semantic-release with locked versions
        run: |
          npm install --package-lock-only --ignore-scripts \
            "@semantic-release/changelog@6.0.3" \
            "@semantic-release/exec@6.0.3" \
            "@semantic-release/git@10.0.1" \
            "@semantic-release/github@9.2.6"
          npm ci --ignore-scripts

      - name: Release with semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release
          GIT_AUTHOR_EMAIL: semantic-release@users.noreply.github.com
          GIT_COMMITTER_NAME: semantic-release
          GIT_COMMITTER_EMAIL: semantic-release@users.noreply.github.com
        run: npx --no semantic-release
