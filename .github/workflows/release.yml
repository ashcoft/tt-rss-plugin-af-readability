name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.5'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests/lint
        run: |
          composer validate
          composer check

      - name: Release with release-please
        id: release
        uses: googleapis/release-please-action@9911d4de73c10fdf8ee3c5de67b93b098fad18bd
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: composer
          package-name: ashcoft/tt-rss-plugin-af-readability
          target-branch: main
          extra-files: composer.json

      - name: Create GitHub Release
        if: steps.release.outputs.releases_created == 'true'
        uses: softprops/action-gh-release@de65e770a299c0a2de6c2f915a6003aa254ca6ac
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          release_name: ${{ steps.release.outputs.tag_name }}
          body: ${{ steps.release.outputs.release_body }}
          draft: false
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
