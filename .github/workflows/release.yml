name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        uses: shivammathur/setup-php@7d835878343a71575c27bf6a326cbcff35fed5bc
        with:
          php-version: '8.4'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate composer
        run: composer validate --strict

      - name: Setup Node.js
        uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install semantic-release with locked versions
        run: |
          npm install --package-lock-only --ignore-scripts \
            "@semantic-release/changelog@6.0.3" \
            "@semantic-release/exec@6.0.3" \
            "@semantic-release/git@10.0.1" \
            "@semantic-release/github@9.2.6"
          npm ci --ignore-scripts

      - name: Release with semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: semantic-release
          GIT_AUTHOR_EMAIL: semantic-release@users.noreply.github.com
          GIT_COMMITTER_NAME: semantic-release
          GIT_COMMITTER_EMAIL: semantic-release@users.noreply.github.com
        run: |
          # Use set +e to prevent immediate exit on error, allowing us to capture
          # semantic-release's exit code and handle "no release needed" gracefully.
          # Exit code 4 means no conventional commits since last release (not an error).
          set +e
          npx --no semantic-release
          exit_code=$?
          set -e
          # Handle "no release needed" (exit code 4) as success
          if [ $exit_code -eq 4 ]; then
            echo "No release needed (no conventional commits)"
            exit 0
          fi
          exit $exit_code
